services:
  - type: web
    name: openinstitute-backend
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: open-institute-updated/backend
    dockerfilePath: Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 120
    healthCheckPath: /api/ready
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: openinstitute-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: openinstitute-frontend
    runtime: docker
    region: frankfurt
    plan: free
    rootDir: open-institute-updated/frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: web
          name: openinstitute-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: API_UPSTREAM_SCHEME
        value: https
