# KOPS-006 build/test automation · KSEC-025/026 dependency scanning in CI · KQA-017
name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: kvbdtc_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kvbdtc_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kvbdtc_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: node scripts/audit-routes.mjs
      - run: node scripts/audit-routes.mjs --ownership
      - run: node scripts/gen-openapi.mjs
      - run: npm test
      - run: npx prisma db push --skip-generate
      - run: npm run test:db

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Fails the build on known HIGH/CRITICAL vulnerabilities in shipped (non-dev) dependencies.
      - run: cd backend && npm install --package-lock-only --ignore-scripts && npm audit --omit=dev --audit-level=high
      - run: cd frontend && npm install --package-lock-only --ignore-scripts && npm audit --omit=dev --audit-level=high
